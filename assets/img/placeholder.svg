    <path d="M400 250 L330 430"/>
    <path d="M400 250 L470 430"/>
    <path d="M360 360 L440 360"/>
    <path d="M400 250 L400 200"/>
  </g>
  <rect x="345" y="200" width="110" height="80" rx="3" fill="#F7F2EA" stroke="#8A6A4F" stroke-width="4" opacity="0.8"/>
  <path d="M352 270 q25 -35 50 -10 q22 22 46 -6" stroke="#5E7C8B" stroke-width="4" fill="none" opacity="0.6"/>
  <text x="400" y="500" text-anchor="middle" font-family="Jost, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="3" fill="#7A6A58">ADICIONE SUA IMAGEM AQUI</text>
