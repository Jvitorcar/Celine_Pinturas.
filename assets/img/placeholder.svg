<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Espaço reservado para imagem">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE3D2"/>
      <stop offset="0.55" stop-color="#E7D8C6"/>
      <stop offset="1" stop-color="#DFC9B6"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#BF6B4B" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#B36A75" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#5E7C8B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#wash)"/>
  <rect width="800" height="600" fill="url(#bloom)"/>
  <!-- moldura dourada discreta -->
