<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="Espaço reservado para foto vertical">
  <defs>
    <linearGradient id="washP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9DCCB"/>
      <stop offset="1" stop-color="#D8C2B0"/>
    </linearGradient>
    <radialGradient id="bloomP" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#B36A75" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#8A9A82" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#washP)"/>
  <rect width="600" height="800" fill="url(#bloomP)"/>
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="#BFA06A" stroke-width="1.5" opacity="0.6"/>
  <!-- silhueta de retrato -->
  <g opacity="0.5" fill="#8A6A4F">
    <circle cx="300" cy="330" r="80"/>
    <path d="M180 560 q120 -150 240 0 Z"/>
  </g>
  <text x="300" y="700" text-anchor="middle" font-family="Jost, Helvetica, Arial, sans-serif" font-size="20" letter-spacing="3" fill="#7A6A58">FOTO DA ARTISTA</text>
</svg>
